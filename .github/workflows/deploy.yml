name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 workflow 发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 站点发布在 https://<user>.github.io/<repo>/，所以要带 /<repo> 前缀。
      # 用户主页仓库（<user>.github.io）或自定义域名则应留空。
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # 测试跑在 build 之后只是历史习惯（几处审计断言原先要现成的 public\exam\），
      # 现在它们自己会按需产数据，顺序已经无所谓——留在这里是因为构建更快失败，
      # 拿不到产物时先看见的是构建报错而不是一串审计红
      - name: Run tests
        run: npm test

      # 注意：不要加 enablement: true。创建 Pages 站点的 API 不接受默认的
      # GITHUB_TOKEN，会以 "Resource not accessible by integration" 硬失败。
      # Pages 必须先在 Settings → Pages → Source 里手动选成 GitHub Actions。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
